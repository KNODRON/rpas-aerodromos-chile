<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RPAS Chile - Análisis Aeronáutico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#e5e7eb}
#map{height:100vh;width:100vw}

.panel{
  position:absolute;top:12px;left:12px;z-index:1000;
  width:340px;max-width:calc(100vw - 24px);
  background:rgba(15,23,42,.95);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;padding:14px;
  box-shadow:0 14px 35px rgba(0,0,0,.35)
}

h1{font-size:18px;margin:0 0 6px;color:#a7f3d0}
p{font-size:12px;color:#cbd5e1;line-height:1.35;margin:6px 0}

.box{
  background:#111827;
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  padding:10px;
  margin-top:10px;
  font-size:13px;
  line-height:1.45
}

select,input,button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:10px;
  border:1px solid #334155;
  background:#020617;
  color:#e5e7eb
}

button{
  border:0;
  background:#059669;
  color:white;
  font-weight:bold;
  cursor:pointer
}

button:hover{background:#047857}

.btn2{background:#334155}
.btn2:hover{background:#475569}

.alerta{
  font-weight:bold;
  padding:8px;
  border-radius:10px;
  margin-top:8px;
  text-align:center
}

.rojo{background:#7f1d1d;color:#fecaca}
.amarillo{background:#78350f;color:#fde68a}
.verde{background:#064e3b;color:#bbf7d0}

.legend{
  position:absolute;right:12px;bottom:12px;z-index:1000;
  background:rgba(15,23,42,.95);
  border:1px solid rgba(255,255,255,.15);
  border-radius:14px;
  padding:12px;
  font-size:12px;
  line-height:1.6
}

.dot{
  display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px
}

@media(max-width:700px){
  .panel{width:calc(100vw - 16px);left:8px;top:8px}
  .legend{display:none}
}
</style>
</head>

<body>

<div class="panel">
  <h1>RPAS Chile - Análisis Aeronáutico</h1>
  <p>Visor preliminar para análisis de proximidad a aeródromos y aeropuertos. Click y arrastra para medir radio dinámico.</p>

  <select id="tipoFiltro">
    <option value="TODOS">Todos</option>
    <option value="Aeropuerto">Aeropuertos</option>
    <option value="Aeródromo">Aeródromos</option>
  </select>

  <input id="busqueda" placeholder="Buscar por nombre, comuna, región u OACI">

  <button onclick="centrarChile()">Centrar Chile</button>
  <button class="btn2" onclick="centrarPirque()">Centrar Pirque</button>
  <button class="btn2" onclick="limpiarMedicion()">Limpiar medición</button>

  <div class="box" id="estado">Cargando datos...</div>
  <div class="box" id="resultado">Medición: sin punto inicial.</div>
</div>

<div class="legend">
  <b>Leyenda</b><br>
  <span class="dot" style="background:#ef4444"></span>Aeropuerto<br>
  <span class="dot" style="background:#f97316"></span>Aeródromo<br>
  <span class="dot" style="background:#22c55e"></span>Punto de medición<br>
  <span class="dot" style="background:#facc15"></span>Radio dinámico
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const puntoPirque = {lat:-33.671139, lon:-70.593222};

let map = L.map("map").setView([-35,-71],5);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,
  attribution:"&copy; OpenStreetMap"
}).addTo(map);

let datos = [];
let capa = L.layerGroup().addTo(map);
let marcadorCercano = null;
let inicio = null;
let marcadorInicio = null;
let linea = null;
let circulo = null;
let arrastrando = false;

function colorTipo(tipo){
  if(tipo === "Aeropuerto") return "#ef4444";
  if(tipo === "Aeródromo") return "#f97316";
  return "#38bdf8";
}

function distanciaKm(a,b){
  const R=6371;
  const dLat=(b.lat-a.lat)*Math.PI/180;
  const dLon=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+
    Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*
    Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function buscarMasCercano(origen){
  let min=Infinity;
  let cercano=null;

  datos.forEach(p=>{
    const d=distanciaKm(origen,{lat:p.lat,lng:p.lon});
    if(d<min){
      min=d;
      cercano=p;
    }
  });

  return {cercano,min};
}

function renderizar(){
  capa.clearLayers();

  const tipo = document.getElementById("tipoFiltro").value;
  const q = document.getElementById("busqueda").value.toLowerCase().trim();

  const visibles = datos.filter(p=>{
    const okTipo = tipo === "TODOS" || p.tipo === tipo;
    const texto = `${p.nombre} ${p.codigo_oaci || p.codigo || ""} ${p.region} ${p.comuna}`.toLowerCase();
    return okTipo && (!q || texto.includes(q));
  });

  visibles.forEach(p=>{
    L.circleMarker([p.lat,p.lon],{
      radius:p.tipo==="Aeropuerto"?7:5,
      color:colorTipo(p.tipo),
      fillColor:colorTipo(p.tipo),
      fillOpacity:.85,
      weight:1
    }).addTo(capa).bindPopup(`
      <b>${p.nombre}</b><br>
      Tipo: ${p.tipo}<br>
      OACI: ${p.codigo_oaci || p.codigo || "S/I"}<br>
      Región: ${p.region || "S/I"}<br>
      Comuna: ${p.comuna || "S/I"}<br>
      Lat/Lon: ${p.lat}, ${p.lon}
    `);
  });

  document.getElementById("estado").innerHTML = `
    <b>Registros visibles:</b> ${visibles.length}<br>
    <b>Total cargado:</b> ${datos.length}<br>
    <b>Fuente:</b> UGIT DAP - DGAC
  `;
}

function alertaPorDistancia(km){
  if(km <= 3) return `<div class="alerta rojo">ALERTA ALTA: infraestructura a menos de 3 km</div>`;
  if(km <= 5) return `<div class="alerta amarillo">PRECAUCIÓN: infraestructura entre 3 y 5 km</div>`;
  return `<div class="alerta verde">Referencia: distancia superior a 5 km</div>`;
}

function actualizarMedicion(destino){
  if(!inicio) return;

  const radio = distanciaKm(inicio,destino);
  const obj = buscarMasCercano(inicio);

  if(linea) map.removeLayer(linea);
  if(circulo) map.removeLayer(circulo);
  if(marcadorCercano) map.removeLayer(marcadorCercano);

  linea = L.polyline([inicio,destino],{
    color:"#facc15",
    weight:3,
    dashArray:"8,8"
  }).addTo(map);

  circulo = L.circle(inicio,{
    radius:radio*1000,
    color:"#facc15",
    weight:2,
    fillColor:"#facc15",
    fillOpacity:.06
  }).addTo(map);

  if(obj.cercano){
    marcadorCercano = L.circleMarker([obj.cercano.lat,obj.cercano.lon],{
      radius:12,
      color:"#ffffff",
      fillColor:"#ef4444",
      fillOpacity:1,
      weight:3
    }).addTo(map).bindPopup(`
      <b>Más cercano</b><br>
      ${obj.cercano.nombre}<br>
      ${obj.cercano.tipo}<br>
      ${obj.min.toFixed(2)} km
    `);
  }

  document.getElementById("resultado").innerHTML = `
    <b>Radio manual:</b> ${radio.toFixed(2)} km<br>
    <b>Más cercano:</b> ${obj.cercano ? obj.cercano.nombre : "S/I"}<br>
    <b>Tipo:</b> ${obj.cercano ? obj.cercano.tipo : "S/I"}<br>
    <b>Distancia al más cercano:</b> ${obj.min.toFixed(2)} km
    ${alertaPorDistancia(obj.min)}
  `;
}

map.on("mousedown",e=>{
  inicio=e.latlng;
  arrastrando=true;

  if(marcadorInicio) map.removeLayer(marcadorInicio);

  marcadorInicio = L.circleMarker(inicio,{
    radius:8,
    color:"#ffffff",
    fillColor:"#22c55e",
    fillOpacity:1,
    weight:2
  }).addTo(map);
});

map.on("mousemove",e=>{
  if(!arrastrando || !inicio) return;
  actualizarMedicion(e.latlng);
});

map.on("mouseup",e=>{
  if(!arrastrando || !inicio) return;
  arrastrando=false;
  actualizarMedicion(e.latlng);
});

function limpiarMedicion(){
  inicio=null;
  arrastrando=false;

  if(marcadorInicio) map.removeLayer(marcadorInicio);
  if(linea) map.removeLayer(linea);
  if(circulo) map.removeLayer(circulo);
  if(marcadorCercano) map.removeLayer(marcadorCercano);

  marcadorInicio=null;
  linea=null;
  circulo=null;
  marcadorCercano=null;

  document.getElementById("resultado").innerHTML = "Medición: sin punto inicial.";
}

function centrarChile(){
  map.setView([-35,-71],5);
}

function centrarPirque(){
  map.setView([puntoPirque.lat,puntoPirque.lon],11);
}

document.getElementById("tipoFiltro").addEventListener("change",renderizar);
document.getElementById("busqueda").addEventListener("input",renderizar);

fetch("aerodromos_chile.json")
  .then(r=>r.json())
  .then(json=>{
    datos=json;
    renderizar();

    L.marker([puntoPirque.lat,puntoPirque.lon])
      .addTo(map)
      .bindPopup("<b>Punto de interés Pirque</b><br>-33.671139, -70.593222");

    document.getElementById("estado").innerHTML += "<br><b>Estado:</b> datos cargados correctamente.";
  })
  .catch(err=>{
    document.getElementById("estado").innerHTML =
      "Error cargando aerodromos_chile.json. Revisa nombre y ubicación del archivo.";
    console.error(err);
  });
</script>

</body>
</html>
